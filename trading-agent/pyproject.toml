[project]
name = "tradeagent"
version = "0.1.0"
description = "Validation-first, risk-gated 24/7 crypto trading agent (paper by default)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[project.optional-dependencies]
exchange = ["ccxt>=4.3"]
dev = ["pytest>=8"]

[project.scripts]
tradeagent = "tradeagent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
